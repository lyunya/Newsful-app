<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="theme-color" content="#1f6feb" />
    <meta
      name="description"
      content="See how news is reported from different sides of the political spectrum"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Newsful" />
    <meta
      property="og:description"
      content="See how news is reported from different sides of the political spectrum"
    />
    <meta property="og:url" content="https://newsful.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply the theme before first paint (mirrors ThemeContext).
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('newsful-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Newsful</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
